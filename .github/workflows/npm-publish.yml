name: Publish dsh-sdr

on:
  push:
    tags:
      - 'dsh-sdr-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish package with npm Trusted Publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dsh-sdr
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Run package tests
        run: npm test

      - name: Verify package version matches tag
        run: |
          node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); const tag = process.env.GITHUB_REF_NAME.replace(/^dsh-sdr-v/, ""); if (pkg.version !== tag) { throw new Error(`package.json version ${pkg.version} does not match tag ${tag}`); }'

      - name: Publish to npm
        run: npm publish --access public
